{% extends "base.html" %}
{% block title %}Novo curso · TodayClass{% endblock %}
{% block content %}
<div class="context-bar">
  <a class="back-link" href="{{ url_for('course_list') }}"><i data-lucide="arrow-left" aria-hidden="true"></i>Todos os cursos</a>
</div>
<div class="page-header">
  <div>
    <h1 class="page-header__title">Novo curso</h1>
  </div>
</div>
{% if error %}
<p class="alert alert--error" role="alert"><i data-lucide="circle-alert" aria-hidden="true"></i><span>{{ error }}</span></p>
{% endif %}
<form class="form-stack" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>
    Nome
    <input type="text" name="name" maxlength="120" required value="{{ name }}">
  </label>
  <div class="form-actions">
    <button type="submit"><i data-lucide="plus" aria-hidden="true"></i>Criar curso</button>
    <a class="button button--ghost" href="{{ url_for('course_list') }}"><i data-lucide="x" aria-hidden="true"></i>Cancelar</a>
  </div>
</form>
{% endblock %}
