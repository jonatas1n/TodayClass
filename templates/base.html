<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Daily course{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --pico-font-size: 16px;
      --pico-form-element-spacing-vertical: 0.4rem;
      --pico-form-element-spacing-horizontal: 0.75rem;
      --pico-spacing: 0.75rem;
      --pico-typography-spacing-vertical: 0.75rem;
    }
    @media (min-width: 576px) {
      :root { --pico-font-size: 16px; }
    }
    @media (min-width: 768px) {
      :root { --pico-font-size: 16px; }
    }
    @media (min-width: 1024px) {
      :root { --pico-font-size: 16px; }
    }
    @media (min-width: 1280px) {
      :root { --pico-font-size: 16px; }
    }
    @media (min-width: 1536px) {
      :root { --pico-font-size: 16px; }
    }
    main.container {
      max-width: 46rem;
    }
    button[type="submit"],
    input:not([type="checkbox"], [type="radio"], [type="hidden"]),
    select,
    textarea {
      width: 100%;
      max-width: 20rem;
    }
    select {
      width: auto;
      min-width: 9rem;
      max-width: 14rem;
    }
    header.bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    header.bar nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
    }
    header.bar nav a {
      font-size: 0.95rem;
    }
    header.bar form,
    header.bar button {
      width: auto;
      max-width: none;
      margin-bottom: 0;
    }
    textarea.course-editor {
      width: 100%;
      max-width: none;
      min-height: 16rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }
    input[name="day"] {
      max-width: 8rem;
    }
    .course-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .course-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }
    .course-list li span {
      color: var(--pico-muted-color);
      font-size: 0.9rem;
    }
    form.action button {
      width: 100%;
      max-width: 16rem;
    }
    form.compact-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 0.75rem;
    }
    form.compact-row label {
      flex: 1 1 12rem;
      margin-bottom: 0;
    }
    article.user-row {
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    article.user-row > header {
      margin-bottom: 0.5rem;
      padding-bottom: 0.35rem;
    }
    .table-wrap {
      overflow-x: auto;
    }
    .course-content {
      overflow-wrap: anywhere;
    }
    .course-content img,
    .course-content video,
    .course-content iframe {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="container">
    {% if current_user.is_authenticated %}
    <header class="bar">
      <nav>
        <a href="{{ url_for('course_list') }}">Courses</a>
        {% if current_user.role == 'admin' %}
        <a href="{{ url_for('admin_dashboard') }}">Progress</a>
        <a href="{{ url_for('new_course') }}">New course</a>
        {% endif %}
      </nav>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="secondary outline">Log out</button>
      </form>
    </header>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
