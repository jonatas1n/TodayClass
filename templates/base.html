<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DiáriaMente{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon.png') }}" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='brand/manifest.json') }}">
  <meta name="theme-color" content="#4338c9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  {% set active_section = 'progress' if request.endpoint == 'admin_dashboard' else 'courses' %}
  <header class="site-header">
    <div class="container site-header__inner">
      <div class="site-header__start">
        <a class="site-header__brand" href="{{ url_for('course_list') }}">
          <img class="brand-mark brand-mark--header" src="{{ url_for('static', filename='brand/logo.png') }}" alt="" width="28" height="28">
          DiáriaMente
        </a>
        <nav class="site-nav">
          <a class="site-nav__link" href="{{ url_for('course_list') }}"{% if active_section == 'courses' %} aria-current="page"{% endif %}>
            <i data-lucide="book-open" aria-hidden="true"></i>
            Cursos
          </a>
          {% if current_user.role == 'admin' %}
          <a class="site-nav__link" href="{{ url_for('admin_dashboard') }}"{% if active_section == 'progress' %} aria-current="page"{% endif %}>
            <i data-lucide="chart-column" aria-hidden="true"></i>
            Progresso
          </a>
          {% endif %}
        </nav>
      </div>
      <div class="site-header__actions">
        <form class="site-header__logout-form" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="site-header__logout">
            <i data-lucide="log-out" aria-hidden="true"></i>
            Sair
          </button>
        </form>
        <span class="site-header__avatar" title="{{ current_user.username }}" aria-hidden="true">{{ current_user.username[:1] }}</span>
      </div>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
