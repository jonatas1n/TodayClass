<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TodayClass{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  {% set active_section = 'progress' if request.endpoint == 'admin_dashboard' else 'courses' %}
  <header class="site-header">
    <div class="container site-header__inner">
      <div class="site-header__start">
        <a class="site-header__brand" href="{{ url_for('course_list') }}">TodayClass</a>
        <nav class="site-nav">
          <a class="site-nav__link" href="{{ url_for('course_list') }}"{% if active_section == 'courses' %} aria-current="page"{% endif %}>Cursos</a>
          {% if current_user.role == 'admin' %}
          <a class="site-nav__link" href="{{ url_for('admin_dashboard') }}"{% if active_section == 'progress' %} aria-current="page"{% endif %}>Progresso</a>
          {% endif %}
        </nav>
      </div>
      <div class="site-header__actions">
        <form class="site-header__logout-form" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="site-header__logout">Sair</button>
        </form>
        <span class="site-header__avatar" title="{{ current_user.username }}" aria-hidden="true">{{ current_user.username[:1] }}</span>
      </div>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
