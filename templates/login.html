{% extends "base.html" %}
{% block title %}Entrar · TodayClass{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__brand-name">TodayClass</span>
    </div>
    <div class="auth-card__header">
      <h1 class="auth-card__title">Entrar</h1>
      <p class="auth-card__subtitle">Acesse seus cursos diários.</p>
    </div>
    {% if error %}
    <p class="alert alert--error" role="alert">{{ error }}</p>
    {% endif %}
    <form class="auth-card__form form-stack" method="post" action="{{ url_for('login', next=request.args.get('next')) if request.args.get('next') else url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        E-mail
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>
        Senha
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="button--block">Entrar</button>
    </form>
    {% if needs_setup %}
    <div class="auth-card__footer">
      <a href="{{ url_for('setup') }}">Criar a primeira conta de administrador</a>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
