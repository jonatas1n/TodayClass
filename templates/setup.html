{% extends "base.html" %}
{% block title %}Configuração · DiáriaMente{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-card__brand">
      <img class="brand-mark" src="{{ url_for('static', filename='brand/logo.png') }}" alt="" width="48" height="48">
      <span class="auth-card__brand-name">DiáriaMente</span>
    </div>
    <div class="auth-card__header">
      <h1 class="auth-card__title">Criar a conta de administrador</h1>
      <p class="auth-card__subtitle">Primeiro acesso: defina o login de administrador.</p>
    </div>
    {% if error %}
    <p class="alert alert--error" role="alert"><i data-lucide="circle-alert" aria-hidden="true"></i><span>{{ error }}</span></p>
    {% endif %}
    <form class="auth-card__form form-stack" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        Usuário
        <input type="text" name="username" autocomplete="username" maxlength="80" required>
      </label>
      <label>
        Senha
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit" class="button--block"><i data-lucide="user-plus" aria-hidden="true"></i>Criar administrador</button>
    </form>
    <div class="auth-card__footer">
      <a href="{{ url_for('login') }}">Entrar</a>
    </div>
  </div>
</div>
{% endblock %}
