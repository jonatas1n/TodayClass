<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curso · DiáriaMente</title>
  <link rel="icon" href="/brand/favicon.png" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#4338c9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/lucide.min.js" defer></script>
  <script type="module" src="/js/pages/course.js"></script>
</head>
<body data-section="courses">
  <header class="site-header">
    <div class="container site-header__inner">
      <div class="site-header__start">
        <a class="site-header__brand" id="site-brand" href="/">
          <img class="site-header__logo" src="/brand/logo.png" alt="" width="32" height="32">
          <span class="site-header__wordmark">DiáriaMente</span>
        </a>
        <nav class="site-nav" id="site-nav" hidden></nav>
      </div>
      <div class="site-header__actions" id="site-actions" hidden></div>
    </div>
  </header>
  <main class="container">
    <div class="context-bar">
      <a class="back-link" href="/courses.html"><i data-lucide="arrow-left" aria-hidden="true"></i>Todos os cursos</a>
    </div>
    <div id="page-error" hidden></div>
    <div id="course-loading" data-loading aria-busy="true">
      <p class="visually-hidden" data-loading-label>Carregando curso</p>
      <div class="skeleton skeleton--headline" aria-hidden="true"></div>
      <div class="progress-panel" aria-hidden="true">
        <span class="skeleton skeleton--line skeleton--short"></span>
        <span class="skeleton skeleton--progress"></span>
      </div>
      <div class="list-toolbar" aria-hidden="true">
        <span class="skeleton skeleton--label"></span>
        <span class="skeleton skeleton--meta"></span>
      </div>
      <div class="lesson-list" aria-hidden="true">
        <div class="skeleton-row">
          <span class="skeleton skeleton--icon"></span>
          <span class="skeleton skeleton--line skeleton--grow"></span>
          <span class="skeleton skeleton--meta"></span>
        </div>
        <div class="skeleton-row">
          <span class="skeleton skeleton--icon"></span>
          <span class="skeleton skeleton--line skeleton--medium skeleton--grow"></span>
          <span class="skeleton skeleton--meta"></span>
        </div>
        <div class="skeleton-row">
          <span class="skeleton skeleton--icon"></span>
          <span class="skeleton skeleton--line skeleton--short skeleton--grow"></span>
          <span class="skeleton skeleton--meta"></span>
        </div>
      </div>
    </div>
    <div id="course-content" hidden>
      <div class="page-header">
        <div>
          <p class="page-header__eyebrow">Curso</p>
          <h1 class="page-header__title" id="course-name"></h1>
        </div>
        <div class="page-header__actions" id="course-actions" hidden>
          <a class="button button--small button--ghost" id="edit-course-button" href="/edit-course.html"><i data-lucide="pencil" aria-hidden="true"></i>Editar</a>
          <a class="button button--small" id="new-lesson-button" href="/lesson-form.html"><i data-lucide="plus" aria-hidden="true"></i>Nova aula</a>
        </div>
      </div>
      <div class="progress-panel">
        <div class="progress-panel__head">
          <span class="progress-panel__label">Progresso</span>
          <span id="progress-summary"></span>
        </div>
        <progress class="progress-bar" id="progress-bar" max="1"></progress>
        <p class="completion-note" id="course-status" hidden></p>
      </div>
      <div class="list-toolbar">
        <h2 class="list-toolbar__title">Aulas</h2>
        <span class="list-toolbar__meta" id="lesson-total"></span>
      </div>
      <div id="lesson-panel"></div>
      <section class="section" id="question-section" hidden>
        <h2 class="section__title">Perguntas</h2>
        <div id="question-panel"></div>
      </section>
    </div>
  </main>
  <script>
    (function registerInstallServiceWorker() {
      if (!("serviceWorker" in navigator)) {
        return;
      }
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch((error) => {
        console.error(error);
      });
    })();
  </script>
</body>
</html>
